name: Build IPA (unsigned)

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-ipa:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Guard AFNetworking private-header import
        run: |
          if grep -R --include='*.h' --include='*.m' 'netinet6/in6.h' Vendor/AFNetworking; then
            echo "Vendored AFNetworking reintroduced the Xcode 26.4-private header"
            exit 1
          fi

      - name: Build unsigned app
        run: |
          set -eo pipefail
          xcodebuild build \
            -project ios-pinning-demo.xcodeproj \
            -scheme ios-pinning-demo \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee xcodebuild-ipa.log | xcbeautify

      - name: Package IPA
        run: |
          set -eo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/ios-pinning-demo.app"
          test -d "$APP" || { echo "ERROR: .app not found at $APP"; exit 1; }
          test -x "$APP/ios-pinning-demo" || {
            echo "ERROR: app binary missing in $APP"
            ls -la "$APP"
            exit 1
          }
          cd "$RUNNER_TEMP"
          rm -rf Payload ios-pinning-demo.ipa
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry ios-pinning-demo.ipa Payload
          ls -lh ios-pinning-demo.ipa
          IPA_SIZE=$(stat -f%z ios-pinning-demo.ipa)
          if [ "$IPA_SIZE" -lt 100000 ]; then
            echo "ERROR: IPA is only ${IPA_SIZE} bytes — refusing to upload an empty/partial package"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v7
        with:
          name: ios-pinning-demo-unsigned-ipa
          path: ${{ runner.temp }}/ios-pinning-demo.ipa

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ipa-build-log
          path: xcodebuild-ipa.log
