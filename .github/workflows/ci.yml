name: CI

on:
  push:
  pull_request:
  # The pinned certificate chains are outside our control, so check weekly that they still match,
  # rather than finding out when somebody tries to use the demo:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: |
          echo "DEVELOPER_DIR=${DEVELOPER_DIR:-<unset>}"
          xcodebuild -version
          xcrun simctl list runtimes | grep -i ios

      - name: Resolve dependencies
        run: xcodebuild -resolvePackageDependencies -project ios-pinning-demo.xcodeproj

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios-pinning-demo.xcodeproj \
            -scheme ios-pinning-demo \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify

      # xcbeautify hides the app's own output, which is where the pinning failure reasons are:
      - name: Explain failures
        if: failure()
        run: |
          echo "--- pinning diagnostics and request errors ---"
          grep -aE "Pinning:|failed with:|XCTAssert" xcodebuild.log | tail -60 || true
          echo "--- build/test errors ---"
          grep -aE "^.*(error|Failing tests):" xcodebuild.log | tail -40 || true

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
