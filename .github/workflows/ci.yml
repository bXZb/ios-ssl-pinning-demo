name: CI

on:
  push:
  pull_request:
  # The pinned certificate chains are outside our control, so check weekly that they still match,
  # rather than finding out when somebody tries to use the demo:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Pick a simulator
        id: simulator
        run: |
          set -o pipefail
          # Each runner image drops the older iPhone models as new Xcodes land, so find the
          # newest iPhone that's actually installed rather than naming a model by hand:
          simulator=$(xcrun simctl list devices available --json | jq -r '
            .devices
            | to_entries
            | map(select(.key | test("SimRuntime\\.iOS-")))
            | sort_by(.key | capture("iOS-(?<v>[0-9-]+)$").v | split("-") | map(tonumber))
            | (last.value // [])
            | map(select(.name | startswith("iPhone")))
            | first // empty
            | "\(.udid) \(.name)"
          ')

          if [ -z "$simulator" ]; then
            echo "No iPhone simulator is available on this runner:"
            xcrun simctl list devices available
            exit 1
          fi

          echo "Testing on ${simulator#* }"
          echo "udid=${simulator%% *}" >> "$GITHUB_OUTPUT"

      - name: Build and run tests
        run: |
          set -o pipefail
          # The project's SDKROOT is iphoneos, so name the simulator SDK explicitly rather than
          # leaving it to be inferred from the destination:
          xcodebuild test \
            -project ios-pinning-demo.xcodeproj \
            -scheme ios-pinning-demo \
            -sdk iphonesimulator \
            -destination "id=${{ steps.simulator.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
