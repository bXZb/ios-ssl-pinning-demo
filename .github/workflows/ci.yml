name: CI

on:
  push:
  pull_request:
  # The pinned certificate chains are outside our control, so check weekly that they still match,
  # rather than finding out when somebody tries to use the demo:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v5

      - name: Show toolchain
        run: xcodebuild -version

      - name: Build and run tests
        run: |
          set -o pipefail
          xcodebuild test \
            -project ios-pinning-demo.xcodeproj \
            -scheme ios-pinning-demo \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 16,OS=latest' \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO \
            2>&1 | tee xcodebuild.log | xcbeautify

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            TestResults.xcresult
            xcodebuild.log
